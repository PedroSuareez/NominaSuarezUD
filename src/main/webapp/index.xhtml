<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sistema de Nómina</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</h:head>

<h:body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand fw-bold">Sistema de Nómina</span>
            <div>
                <h:link outcome="index"     styleClass="btn btn-outline-light btn-sm me-1">Inicio</h:link>
                <h:link outcome="historial" styleClass="btn btn-outline-light btn-sm">Historial</h:link>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="card">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">Datos del Empleado</h5>
                    </div>
                    <div class="card-body">
                        <h:form>

                            <div class="mb-3">
                                <h:outputLabel for="nombre" value="Nombre completo"
                                               styleClass="form-label"/>
                                <h:inputText id="nombre" value="#{nominaBean.nombre}"
                                             styleClass="form-control"
                                             placeholder="Ej. Juan Pérez"
                                             required="true"
                                             requiredMessage="El nombre es obligatorio."/>
                                <h:message for="nombre" styleClass="text-danger small"/>
                            </div>

                            <div class="mb-3">
                                <h:outputLabel for="id" value="Identificación"
                                               styleClass="form-label"/>
                                <h:inputText id="id" value="#{nominaBean.id}"
                                             styleClass="form-control"
                                             placeholder="Ej. 1234567890"
                                             required="true"
                                             requiredMessage="La identificación es obligatoria."/>
                                <h:message for="id" styleClass="text-danger small"/>
                            </div>

                            <div class="mb-3">
                                <h:outputLabel for="salario" value="Salario básico"
                                               styleClass="form-label"/>
                                <h:selectOneMenu id="salario"
                                                 value="#{nominaBean.salarioBasico}"
                                                 styleClass="form-select"
                                                 required="true"
                                                 requiredMessage="Seleccione un salario.">
                                    <f:selectItem itemValue=""        itemLabel="-- Seleccione --"/>
                                    <f:selectItem itemValue="1750905" itemLabel="$1.750.905 (1 SMMLV)"/>
                                    <f:selectItem itemValue="2000000" itemLabel="$2.000.000"/>
                                    <f:selectItem itemValue="2500000" itemLabel="$2.500.000"/>
                                    <f:selectItem itemValue="3000000" itemLabel="$3.000.000"/>
                                    <f:selectItem itemValue="3501810" itemLabel="$3.501.810 (2 SMMLV)"/>
                                    <f:selectItem itemValue="4000000" itemLabel="$4.000.000"/>
                                    <f:selectItem itemValue="5000000" itemLabel="$5.000.000"/>
                                    <f:selectItem itemValue="8000000" itemLabel="$8.000.000"/>
                                </h:selectOneMenu>
                                <h:message for="salario" styleClass="text-danger small"/>
                                <div class="form-text">
                                    Aplica auxilio de transporte si salario ≤ $3.501.810 (2 SMMLV)
                                </div>
                            </div>

                            <div class="mb-4">
                                <h:outputLabel for="dias" value="Días trabajados (1 - 30)"
                                               styleClass="form-label"/>
                                <h:inputText id="dias" value="#{nominaBean.dias}"
                                             styleClass="form-control"
                                             placeholder="Ej. 30"
                                             required="true"
                                             requiredMessage="Los días son obligatorios.">
                                    <f:validateLongRange minimum="1" maximum="30"/>
                                </h:inputText>
                                <h:message for="dias" styleClass="text-danger small"/>
                            </div>

                            <div class="d-flex gap-2">
                                <h:commandButton value="Calcular"
                                                 action="#{nominaBean.calcular}"
                                                 styleClass="btn btn-primary"/>
                                <h:commandButton value="Limpiar"
                                                 action="#{nominaBean.nuevaNomina}"
                                                 styleClass="btn btn-secondary"
                                                 immediate="true"/>
                            </div>

                        </h:form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"/>
</h:body>
</html>
